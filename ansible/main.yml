
---
- name: Configure workstation
  hosts: localhost
  connection: local
  become: false

  vars:
    apt_packages:
      - curl
      - zip
      - tmux
      - btop
      - tree
      - jq
      - python-is-python3
      - gnome-tweaks
      - gnome-shell-extensions
      - vim
      - git
      - gh

    sdkman_packages:
      - { candidate: java, version: "25-zulu" }
      - { candidate: sbt, version: "1.11.7" }
      - { candidate: maven, version: "3.8.8" }

    dotfiles:
      - vimrc
      - tmux.conf

    nvm_version: v0.41.0

  tasks:
    # --------------------------------------------------
    # System packages
    # --------------------------------------------------

    - name: Update and upgrade packages
      become: true
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
        autoremove: true
        autoclean: true
      tags: [packages]

    - name: Install apt packages
      become: true
      ansible.builtin.apt:
        name: "{{ apt_packages }}"
        state: present
      tags: [packages]

    # --------------------------------------------------
    # Dotfiles
    # --------------------------------------------------

    - name: Link configuration files
      ansible.builtin.file:
        src: "{{ ansible_env.HOME }}/.dotfiles/.{{ item }}"
        dest: "{{ ansible_env.HOME }}/.{{ item }}"
        state: link
        force: true
      loop: "{{ dotfiles }}"
      tags: [dotfiles]

    - name: Create IdeaVim configuration
      ansible.builtin.copy:
        src: "{{ ansible_env.HOME }}/.dotfiles/.vimrc"
        dest: "{{ ansible_env.HOME }}/.ideavimrc"
        remote_src: true
        force: false
        mode: '0644'
      tags: [dotfiles]

    - name: Disable IntelliJ bell
      ansible.builtin.lineinfile:
        path: "{{ ansible_env.HOME }}/.ideavimrc"
        line: "set visualbell"
        state: present
      tags: [dotfiles]

    - name: Configure bashrc
      ansible.builtin.blockinfile:
        path: "{{ ansible_env.HOME }}/.bashrc"
        block: |
          source ~/.dotfiles/.tobashrc
        marker: "# {mark} ANSIBLE DOTFILES"
      tags: [dotfiles]

    # --------------------------------------------------
    # SDKMAN
    # --------------------------------------------------

    - name: Install SDKMAN
      ansible.builtin.shell: |
        curl -s "https://get.sdkman.io" | bash
      args:
        creates: "{{ ansible_env.HOME }}/.sdkman/bin/sdkman-init.sh"
      tags: [sdkman]

    - name: Install SDKMAN candidates
      ansible.builtin.shell: |
        source "$HOME/.sdkman/bin/sdkman-init.sh"
        sdk install {{ item.candidate }} {{ item.version }}
      args:
        executable: /bin/bash
        creates: "{{ ansible_env.HOME }}/.sdkman/candidates/{{ item.candidate }}/{{ item.version }}"
      loop: "{{ sdkman_packages }}"
      tags: [sdkman]

    # --------------------------------------------------
    # NVM / Node.js
    # --------------------------------------------------

    - name: Install NVM
      ansible.builtin.shell: |
        curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/{{ nvm_version }}/install.sh | bash
      args:
        executable: /bin/bash
        creates: "{{ ansible_env.HOME }}/.nvm/nvm.sh"
      environment:
        PROFILE: /dev/null
      tags: [nvm]

    - name: Configure NVM in bashrc
      ansible.builtin.blockinfile:
        path: "{{ ansible_env.HOME }}/.bashrc"
        block: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          [ -s "$NVM_DIR/bash_completion" ] && \. "$NVM_DIR/bash_completion"
        marker: "# {mark} ANSIBLE NVM"
      tags: [nvm]

    - name: Install Node.js LTS
      ansible.builtin.shell: |
        source "$HOME/.nvm/nvm.sh"
        nvm install --lts
      args:
        executable: /bin/bash
      register: nvm_install_result
      changed_when: "'already installed' not in nvm_install_result.stdout"
      tags: [nvm]

    - name: Set default Node.js version
      ansible.builtin.shell: |
        source "$HOME/.nvm/nvm.sh"
        nvm alias default 'lts/*'
      args:
        executable: /bin/bash
      changed_when: false
      tags: [nvm]

    # --------------------------------------------------
    # TODO: Development tools and applications
    # --------------------------------------------------

